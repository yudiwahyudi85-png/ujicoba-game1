<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tarik Tambang Jaringan | XI TKJ</title>
<style>
  :root{
    --kiri:#22c55e; --kanan:#ef4444; --netral:#f59e0b;
    --bg1:#0f172a; --bg2:#1e293b; --panel:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
  body{
    min-height:100vh;color:#fff;
    background:
      radial-gradient(circle at 20% 10%, rgba(34,197,94,.12), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(239,68,68,.12), transparent 40%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:16px;
  }
  .app{max-width:980px;margin:0 auto}
  header{text-align:center;margin-bottom:14px}
  h1{font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:.5px}
  .badge{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:.85rem}

  .scoreboard{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    border-radius:14px;padding:10px 16px;margin-bottom:14px}
  .team{display:flex;align-items:center;gap:10px;font-weight:700}
  .team .icon{font-size:1.8rem}
  .team.kiri{color:var(--kiri)} .team.kanan{color:var(--kanan)}
  .score{font-size:1.6rem;min-width:2ch;text-align:center}
  .vs{opacity:.8;font-weight:800}

  .arena{position:relative;height:190px;border-radius:16px;overflow:hidden;
    border:2px solid rgba(255,255,255,.25);
    background:linear-gradient(#38bdf8 0 55%, #16a34a 55% 100%)}
  .arena::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.05) 60px 61px)}
  .zone{position:absolute;top:0;bottom:0;width:18%;opacity:.25}
  .zone.kiri{left:0;background:linear-gradient(90deg,var(--kiri),transparent)}
  .zone.kanan{right:0;background:linear-gradient(-90deg,var(--kanan),transparent)}
  .center-line{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;opacity:.9}
  .rope{position:absolute;left:8%;right:8%;top:58%;height:14px;border-radius:8px;
    background:repeating-linear-gradient(45deg,#92400e 0 12px,#b45309 12px 24px);
    box-shadow:0 3px 6px rgba(0,0,0,.35)}
  .knot{position:absolute;top:58%;left:50%;width:26px;height:26px;border-radius:50%;
    background:var(--netral);border:3px solid #fff;transform:translate(-50%,-30%);
    transition:left .7s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 12px rgba(245,158,11,.9)}
  .flag{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:1.4rem;
    transition:left .7s cubic-bezier(.34,1.56,.64,1)}
  .char{position:absolute;top:42%;font-size:2.6rem;transition:transform .3s}
  .char.kiri{left:4%}
  .char.kanan{right:4%}
  .pull-left .char.kiri{animation:pullL .5s}
  .pull-right .char.kanan{animation:pullR .5s}
  @keyframes pullL{50%{transform:translateX(-10px) rotate(-6deg)}}
  @keyframes pullR{50%{transform:translateX(10px) rotate(6deg)}}

  .meter{height:10px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin:10px 0 16px}
  .meter-fill{height:100%;width:50%;background:linear-gradient(90deg,var(--kiri),var(--kanan));
    transition:width .7s cubic-bezier(.34,1.56,.64,1)}

  .panel{background:var(--panel);color:#0f172a;border-radius:16px;padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .qnum{font-weight:700;color:#1d4ed8}
  .timer{font-weight:800;font-size:1.05rem;padding:4px 12px;border-radius:999px;
    background:#f1f5f9;border:2px solid #cbd5e1;min-width:64px;text-align:center}
  .timer.warn{background:#fee2e2;border-color:#ef4444;color:#b91c1c;animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.5}}
  .qtext{font-size:1.1rem;font-weight:600;line-height:1.5;margin-bottom:14px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .option{border:3px solid #c7d2fe;background:#eef2ff;color:#111827;padding:12px;border-radius:12px;
    cursor:pointer;text-align:left;font-size:.98rem;font-weight:600;transition:.15s}
  .option:hover:not(:disabled){transform:translateY(-2px);background:#e0e7ff}
  .option:disabled{cursor:not-allowed;opacity:.95}
  .option.correct{background:var(--kiri)!important;border-color:#15803d!important;color:#fff}
  .option.wrong{background:var(--kanan)!important;border-color:#b91c1c!important;color:#fff}
  .feedback{margin-top:12px;padding:10px;border-radius:10px;font-weight:700;text-align:center;min-height:18px}
  .feedback.ok{background:#dcfce7;color:#166534}
  .feedback.no{background:#fee2e2;color:#991b1b}
  .next{display:block;margin:14px auto 0;background:linear-gradient(135deg,#1d4ed8,#2563eb);
    color:#fff;border:none;padding:12px 28px;border-radius:999px;font-size:1rem;font-weight:800;cursor:pointer}
  .next:hover{transform:scale(1.05)}
  .hint{margin-top:8px;text-align:center;font-size:.8rem;color:#64748b}

  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.8);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .result{background:#fff;color:#0f172a;border-radius:20px;max-width:520px;width:100%;
    text-align:center;padding:28px;position:relative;overflow:hidden}
  .result .big{font-size:4rem}
  .result h2{margin:10px 0;font-size:1.7rem}
  .result.win h2{color:#15803d}.result.lose h2{color:#b91c1c}.result.draw h2{color:#b45309}
  .stats{display:flex;justify-content:center;gap:18px;margin:14px 0;font-weight:700}
  .stats div{background:#f1f5f9;border-radius:12px;padding:10px 16px}
  .stats .k{color:var(--kiri)} .stats .c{color:var(--kanan)}
  .msg{color:#334155;line-height:1.6}
  .again{margin-top:16px;background:linear-gradient(135deg,#16a34a,#22c55e);
    border:none;color:#fff;padding:12px 30px;border-radius:999px;font-weight:800;cursor:pointer;font-size:1rem}

  .confetti{position:fixed;top:-20px;font-size:1.2rem;animation:fall linear forwards;z-index:60;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media(max-width:640px){
    .options{grid-template-columns:1fr}
    .arena{height:160px}.char{font-size:2rem}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🪢 TARIK TAMBANG JARINGAN 🪢</h1>
    <span class="badge">Materi: Jaringan Kabel &amp; Nirkabel • Kelas XI TKJ</span>
  </header>

  <div class="scoreboard">
    <div class="team kiri"><span class="icon">🧑‍🎓</span> SISWA <span class="score" id="scoreL">0</span></div>
    <div class="vs">VS</div>
    <div class="team kanan"><span class="score" id="scoreR">0</span> KOMPUTER <span class="icon">🖥️</span></div>
  </div>

  <div class="arena" id="arena">
    <div class="zone kiri"></div><div class="zone kanan"></div>
    <div class="center-line"></div>
    <div class="rope"></div>
    <div class="knot" id="knot"></div>
    <div class="flag" id="flag">🚩</div>
    <div class="char kiri">🧑‍🎓🧑‍🎓</div>
    <div class="char kanan">🖥️🖥️</div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

  <div class="panel" id="quizPanel">
    <div class="panel-top">
      <span class="qnum" id="qNum">Soal 1 / 10</span>
      <span class="timer" id="timer">20</span>
    </div>
    <div class="qtext" id="qText">Memuat soal…</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="btnNext" style="display:none">Soal Berikutnya ➡️</button>
    <div class="hint">⌨️ Bisa tekan tombol 1–4 di keyboard untuk menjawab</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="result" id="resultCard">
    <div class="big" id="resEmoji">🏆</div>
    <h2 id="resTitle">HASIL</h2>
    <div class="stats">
      <div class="k">🧑‍🎓 Benar: <span id="resL">0</span></div>
      <div class="c">🖥️ Menang: <span id="resR">0</span></div>
    </div>
    <p class="msg" id="resMsg"></p>
    <button class="again" onclick="restart()">🔄 Main Lagi</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {q:"Kabel jaringan yang paling umum dipakai pada LAN dan memiliki 8 inti kabel adalah…",
   o:["Kabel Coaxial","Kabel UTP","Kabel Fiber Optic","Kabel HDMI"],a:1},
  {q:"Konektor yang dipasang pada ujung kabel UTP untuk jaringan Ethernet adalah…",
   o:["RJ-11","BNC","RJ-45","USB"],a:2},
  {q:"Standar IEEE untuk jaringan Wireless LAN (Wi-Fi) adalah…",
   o:["802.3","802.11","802.15","802.16"],a:1},
  {q:"Frekuensi yang umum digunakan Wi-Fi adalah…",
   o:["2,4 GHz & 5 GHz","900 MHz & 1 GHz","10 GHz & 12 GHz","100 MHz & 200 MHz"],a:0},
  {q:"Kabel yang mentransmisikan data menggunakan cahaya adalah…",
   o:["UTP","Coaxial","Fiber Optic","Twisted Pair"],a:2},
  {q:"Topologi jaringan di mana semua komputer terpusat pada satu switch/hub adalah…",
   o:["Bus","Ring","Star","Mesh"],a:2},
  {q:"Teknologi nirkabel jarak pendek untuk headphone/mouse/keyboard adalah…",
   o:["Wi-Fi","Bluetooth","Infrared","NFC"],a:1},
  {q:"Kecepatan maksimum Gigabit Ethernet adalah…",
   o:["10 Mbps","100 Mbps","1 Gbps","10 Gbps"],a:2},
  {q:"Kabel coaxial memiliki lapisan pelindung berupa…",
   o:["Braided shield","Fiber core","UTP jacket","Twisted core"],a:0},
  {q:"Mode wireless di mana perangkat terhubung melalui Access Point disebut…",
   o:["Ad-hoc","Infrastructure","Peer-to-peer","Direct"],a:1}
];

const TIME_LIMIT = 20;
let idx=0, correct=0, offset=0, answered=false, timerId=null, timeLeft=TIME_LIMIT;

const $ = id => document.getElementById(id);

function loadQuestion(){
  answered=false;
  const q=QUESTIONS[idx];
  $("qNum").textContent=`Soal ${idx+1} / ${QUESTIONS.length}`;
  $("qText").textContent=q.q;
  $("feedback").textContent=""; $("feedback").className="feedback";
  $("btnNext").style.display="none";
  const box=$("options"); box.innerHTML="";
  q.o.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="option"; b.textContent=String.fromCharCode(65+i)+". "+opt;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  startTimer();
}

function startTimer(){
  clearInterval(timerId); timeLeft=TIME_LIMIT; updateTimer();
  timerId=setInterval(()=>{
    timeLeft--; updateTimer();
    if(timeLeft<=0){ clearInterval(timerId); timeUp(); }
  },1000);
}
function updateTimer(){
  const t=$("timer"); t.textContent=timeLeft;
  t.classList.toggle("warn",timeLeft<=5);
}

function timeUp(){
  if(answered) return;
  answered=true;
  const q=QUESTIONS[idx];
  [...$("options").children].forEach((b,i)=>{
    b.disabled=true; if(i===q.a) b.classList.add("correct");
  });
  $("feedback").textContent="⏰ Waktu habis! Komputer menarik tali ke kanan.";
  $("feedback").className="feedback no";
  wrongEffect(); showNext();
}

function answer(i){
  if(answered) return;
  answered=true; clearInterval(timerId);
  const q=QUESTIONS[idx];
  const btns=[...$("options").children];
  btns.forEach(b=>b.disabled=true);

  if(i===q.a){
    btns[i].classList.add("correct");
    correct++; $("scoreL").textContent=correct;
    $("feedback").textContent="✅ BENAR! Siswa menarik tali ke kiri!";
    $("feedback").className="feedback ok";
    offset--; correctEffect();
  }else{
    btns[i].classList.add("wrong");
    btns[q.a].classList.add("correct");
    $("feedback").textContent="❌ SALAH! Komputer menarik tali ke kanan.";
    $("feedback").className="feedback no";
    offset++; wrongEffect();
  }
  updateRope(); showNext();
}

function showNext(){
  const btn=$("btnNext");
  btn.style.display="block";
  btn.textContent = idx===QUESTIONS.length-1 ? "🏁 Lihat Hasil" : "Soal Berikutnya ➡️";
}

$("btnNext").onclick=()=>{
  idx++;
  if(idx>=QUESTIONS.length) finish();
  else loadQuestion();
};

function updateRope(){
  const pos = 50 + offset*4;               // geser 4% per poin
  $("knot").style.left=pos+"%";
  $("flag").style.left=pos+"%";
  $("meterFill").style.width=pos+"%";
  const arena=$("arena");
  arena.classList.remove("pull-left","pull-right");
  void arena.offsetWidth;
  arena.classList.add(offset<0?"pull-left":"pull-right");
}

function finish(){
  clearInterval(timerId);
  const wrong=QUESTIONS.length-correct;
  $("resL").textContent=correct;
  $("resR").textContent=wrong;

  let cls,title,emoji,msg;
  if(correct===10){
    cls="win"; emoji="🏆🥇🎉"; title="SISWA MENANG SEMPURNA!";
    msg="Luar biasa! Semua jawaban benar — tali sepenuhnya tertarik ke sisi siswa. Kamu menguasai materi jaringan kabel & nirkabel!";
    confetti(120);
  }else if(correct>wrong){
    cls="win"; emoji="🎉🧑‍🎓"; title="SISWA MENANG!";
    msg="Hebat! Jawaban benarmu lebih banyak, tali bergerak ke sisi siswa. Tingkatkan lagi sampai menang sempurna!";
    confetti(60);
  }else if(correct===wrong){
    cls="draw"; emoji="🤝"; title="SERI!";
    msg="Kekuatan seimbang! Pelajari kembali materi jaringan dan coba lagi untuk mengalahkan komputer.";
  }else{
    cls="lose"; emoji="🖥️😎"; title="KOMPUTER MENANG!";
    msg="Jangan menyerah! Baca kembali materi kabel & nirkabel, lalu tantang komputer lagi.";
  }

  $("resultCard").className="result "+cls;
  $("resEmoji").textContent=emoji;
  $("resTitle").textContent=title;
  $("resMsg").textContent=msg;
  $("overlay").classList.add("show");

  if(cls==="win") playWin(); else if(cls==="lose") tone(180,.4,"sawtooth");
}

function restart(){
  idx=0; correct=0; offset=0;
  $("scoreL").textContent=0; $("scoreR").textContent=0;
  $("overlay").classList.remove("show");
  updateRope(); loadQuestion();
}

function confetti(n){
  const icons=["🎉","✨","🎊","⭐","🏆"];
  for(let i=0;i<n;i++){
    const s=document.createElement("span");
    s.className="confetti";
    s.textContent=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),4500);
  }
}

/* ---- Efek suara sederhana (WebAudio, tanpa file) ---- */
let AC=null;
function ctx(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq,dur,type="sine",when=0){
  try{
    const a=ctx(),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(.15,a.currentTime+when);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);
    o.start(a.currentTime+when);o.stop(a.currentTime+when+dur);
  }catch(e){}
}
function correctEffect(){ tone(660,.12); tone(880,.18,"sine",.12); }
function wrongEffect(){ tone(220,.2,"sawtooth"); tone(160,.25,"sawtooth",.15); }
function playWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",i*.18)); }

/* Keyboard 1-4 untuk jawab, Enter untuk lanjut */
document.addEventListener("keydown",e=>{
  if(!$("overlay").classList.contains("show") && !answered && ["1","2","3","4"].includes(e.key)){
    answer(+e.key-1);
  }else if(e.key==="Enter" && $("btnNext").style.display==="block"){
    $("btnNext").click();
  }
});

loadQuestion();
</script>
</body>
</html>
